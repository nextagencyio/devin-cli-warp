name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Make scripts executable
        run: chmod +x scripts/*.sh tests/test-hooks.sh install.sh
      - name: Run tests
        run: ./tests/test-hooks.sh
